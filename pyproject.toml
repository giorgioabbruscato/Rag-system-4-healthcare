[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "privacy: marks tests related to data privacy/anonymization",
]

[tool.coverage.run]
source = ["src", "api", "scripts"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
  [build-system]
  requires = ["setuptools>=68.0", "wheel"]
  build-backend = "setuptools.backends._legacy:_Backend"

  [project]
  name = "rag-healthcare"
  version = "0.1.0"
  description = "Multimodal RAG system for clinical decision support in cardiology"
  requires-python = ">=3.10"
  dependencies = [
      # copiare da requirements.txt
  ]

  [project.optional-dependencies]
  dev = [
      # copiare da requirements-dev.txt
  ]

  [tool.setuptools.packages.find]
  include = ["src*", "api*", "scripts*"]
